[project]
name = "agent-harness"
version = "0.1.0"
description = "不预设用途的通用 Agent Harness：runtime + agent loop + 有主张的默认栈"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness = "agent_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
