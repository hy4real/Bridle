[project]
name = "bridle"
version = "0.1.0"
description = "Bridle：不预设用途的通用 Agent Harness 运行时（runtime + agent loop + 有主张的默认栈）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness = "bridle.cli:main"

[dependency-groups]
dev = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
